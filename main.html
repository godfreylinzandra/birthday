<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="screen2" class="screen" style="opacity:1; pointer-events:all;">
  <h1>Happy Birthday Mechy!!!🎉🎉🎉</h1>

  <div class="cake-wrap">
    <div class="candle-row" id="candles"></div>

    <div class="cake">
      <div class="frost"></div>
      <div style="height:120px;display:flex;align-items:center;justify-content:center;font-weight:700">
        Make a wish!!!
      </div>
    </div>

    <div class="plate"></div>
    <div class="puff" id="puff"></div>
  </div>

  <div class="status" id="status">27 candles lit</div>
  Hi, please enable your mic to blow the candles. <br>   Blow near it, the stronger the better.

  <div style="margin-top:20px;">
    <button id="blowBtn">Blow</button>
    <button id="resetBtn">Reset</button>
    <button id="micBtn">Enable Mic</button>
  
  </div>
</div>
<div id="fireworks"></div>


<script src="script.js"></script>
</body>
</html>
